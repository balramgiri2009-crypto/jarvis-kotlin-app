name: Unzip and Build Kotlin APK
on: [push, pull_request]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Force Create Missing Android Structure (MASTER FIX)
      run: |
        # बिल्कुल नया और फ्रेश एंड्रॉइड डायरेक्टरी स्ट्रक्चर बनाना
        mkdir -p app/src/main/java/com/example/jarvis
        mkdir -p app/src/main/res/values
        
        # आपकी ज़िप फ़ाइल को अनज़िप करना
        unzip project.zip -d ./app_source || true
        
        # (CRITICAL STEP): कोटलिन फाइलों के अंदर के पुराने पैकेज नाम को हटाकर com.example.jarvis में बदलना
        # यह कमांड आपकी फाइलों के अंदर की पैकेज गड़बड़ को ऑटोमैटिक ठीक कर देगा
        if [ -d "./app_source" ]; then
          find ./app_source -name "*.kt" -exec sed -i 's/^package .*/package com.example.jarvis/' {} \;
        fi
        
        # फ़ाइलों को उनकी बिल्कुल सही और सटीक जगहों पर पहुँचाना
        cp app_source/*.kt app/src/main/java/com/example/jarvis/ 2>/dev/null || true
        cp app_source/AndroidManifest.xml app/src/main/ 2>/dev/null || true
        
        # ग्रैडल के लिए बिल्कुल सही और सटीक रिपोजिटरी सेटिंग्स लिखना
        echo "pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include(':app')" > settings.gradle
        
        echo "plugins {
            id(\"com.android.application\") version \"8.1.0\" apply false
            id(\"org.jetbrains.kotlin.android\") version \"1.8.20\" apply false
        }" > build.gradle
        
        echo "plugins {
            id(\"com.android.application\")
            id(\"org.jetbrains.kotlin.android\")
        }
        android {
            compileSdk = 33
            defaultConfig {
                applicationId = \"com.example.jarvis\"
                minSdk = 21
                targetSdk = 33
                versionCode = 1
                versionName = \"1.0\"
            }
            kotlinOptions {
                jvmTarget = \"17\"
            }
        }
        dependencies {
            implementation(\"androidx.core:core-ktx:1.10.1\")
        }" > app/build.gradle

    - name: Compile and Setup Wrapper
      run: |
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Kotlin-APK
        path: "app/build/outputs/apk/debug/*.apk"
