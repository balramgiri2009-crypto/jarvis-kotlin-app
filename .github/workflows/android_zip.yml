- name: Cache Gradle Dependencies
  uses: actions/cache@v5
  with:
    # 1. यहाँ उस फोल्डर का रास्ता आएगा जिसे सुरक्षित रखना है
    path: |
      ~/.gradle/caches
      ~/.gradle/wrapper
    # 2. यहाँ एक यूनीक लॉक चाबी आएगी जो ग्रैडल फाइलों के हिसाब से सेव होगी
    key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
    # 3. अगर सटीक चाबी न मिले, तो पुरानी मिलती-जुलती फाइलें उठाने के लिए
    restore-keys: |
      ${{ runner.os }}-gradle-
