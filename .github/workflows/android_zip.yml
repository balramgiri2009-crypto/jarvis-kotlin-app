name: Build Claude Project APK
on: [push, pull_request]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Claude Project
      run: |
        # क्लॉड की दी हुई असली ज़िप फाइल को सही जगह अनज़िप करना
        unzip project.zip -d ./cl_project || true
        
        # अगर फाइलें किसी सब-फोल्डर में हैं, तो उन्हें मुख्य जगह पर लाना
        if [ -d "./cl_project/Richer" ]; then
          mv ./cl_project/Richer/* ./ 2>/dev/null || true
        else
          mv ./cl_project/* ./ 2>/dev/null || true
        fi
        
        # ग्रैडल टूल्स को रनटाइम परमिशन देना
        chmod +x gradlew || true

    - name: Compile and Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Kotlin-APK
        path: "**/build/outputs/apk/debug/*.apk"
