name: Unzip and Build Kotlin APK
on: [push, pull_request]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Force Create Missing Android Structure (SYNTAX FIX)
      run: |
        # ग्रैडल के लिए बिल्कुल फ्रेश और सही डायरेक्टरी स्ट्रक्चर बनाना
        mkdir -p app/src/main/java/com/example/jarvis
        mkdir -p app/src/main/res/values
        
        # आपकी ज़िप फ़ाइल को अनज़िप करना
        unzip project.zip -d ./app_source || true
        
        # फ़ाइलों को उनकी सही और सटीक जगहों पर पहुँचाना
        cp app_source/*.kt app/src/main/java/com/example/jarvis/ 2>/dev/null || true
        cp app_source/AndroidManifest.xml app/src/main/ 2>/dev/null || true
        
        # (CRITICAL SYNTAX FIX): ग्रैडल फ़ाइलों को बिल्कुल सही फॉर्मेट में लिखना ताकि 1 error हट जाए
        echo "include(':app')" > settings.gradle
        
        echo "plugins {
            id(\"com.android.application\") version \"8.1.0\" apply false
            id(\"org.jetbrains.kotlin.android\") version \"1.8.20\" apply false
        }" > build.gradle
        
        echo "plugins {
            id(\"com.android.application\")
            id(\"org.jetbrains.kotlin.android\")
        }
        android {
            compileSdk = 33
            defaultConfig {
                applicationId = \"com.example.jarvis\"
                minSdk = 21
                targetSdk = 33
                versionCode = 1
                versionName = \"1.0\"
            }
            kotlinOptions {
                jvmTarget = \"17\"
            }
        }
        dependencies {
            implementation(\"androidx.core:core-ktx:1.10.1\")
        }" > app/build.gradle

    - name: Compile and Setup Wrapper
      run: |
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-Kotlin-APK
        path: "app/build/outputs/apk/debug/*.apk"
